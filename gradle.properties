# =========================================================================
# PROJETO: L-Shell Orbit (L-Shell Orbit Android)
# ARQUIVO: gradle.properties
# VERSÃO: v1.0 (2026-09-20)
#
# CHANGELOG:
# - [v1.0 | 2026-09-20]: Habilitado suporte obrigatório a bibliotecas AndroidX
#   (android.useAndroidX=true), otimização de memória JVM para o daemon do Gradle
#   e isolamento de recursos (android.nonTransitiveRClass=true).
# - Motivo: Resolver erro de compilação com dependências do Jetpack Compose e Glance.
# =========================================================================

# Ativa o suporte obrigatório a bibliotecas AndroidX
android.useAndroidX=true

# Otimizações de compilação e empacotamento
android.nonTransitiveRClass=true

# Configuração de memória da JVM para evitar lentidão e out-of-memory durante o build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

